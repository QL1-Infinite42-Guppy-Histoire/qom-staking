<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QOM Staking — Delegate QOM on QL1</title>
<script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem("guppy-theme")==="dark"?"dark":"light";}catch(e){document.documentElement.dataset.theme="light";}})();</script>
<link rel="stylesheet" href="./style.css?v=20" />
<script>
/* Language gate: a saved choice (qomstaking_lang = "ja") goes to the
   Japanese page; anything else — including no saved choice — defaults
   to English. The language can be changed later with the selector in
   each page's header (top right). Same scheme as the DEX aggregator. */
(function () {
  var lang = null;
  try { lang = localStorage.getItem("qomstaking_lang"); } catch (e) { /* storage unavailable: default English */ }
  location.replace(lang === "ja" ? "ja.html" : "en.html");
})();
</script>
</head>
<body>
  <header class="top">
    <div>
      <h1>QOM Staking</h1>
      <p class="sub">Choose your language / 言語を選んでください</p>
      <p class="sub"><a href="en.html">English</a> ・ <a href="ja.html">日本語</a></p>
      <noscript><p class="sub">JavaScript is disabled — please use the links above. / JavaScript が無効です。上のリンクからお進みください。</p></noscript>
    </div>
  </header>
</body>
</html>
